<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Library — Zakhar Galanin</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #001f3f;
    --accent: #ff851b;
    --accent-hover: #ffa64d;
    --line: rgba(255,255,255,0.2);
    --grid-size: 80px;
    --header-height: 80px;
    --header-pad: 80px;
    --logo-size: 60px;
    --title-size: 14px;
    --detail-size: 12px;
    --dot-size: 12px;
  }
  @media (max-width: 800px) {
    :root { --grid-size: 60px; --header-height: 60px; --header-pad: 40px;
            --logo-size: 30px; --title-size: 18px; --detail-size: 15px; }
  }
  @media (max-width: 600px) {
    :root { --grid-size: 60px; --header-height: 40px; --header-pad: 20px;
            --logo-size: 24px; --title-size: 16px; --detail-size: 14px; --dot-size: 8px; }
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    font-family: 'Orbitron', Arial, sans-serif; color: #fff;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
  }

  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 var(--header-pad); height: var(--header-height);
    position: relative; z-index: 3;
  }
  .logo, .back-button {
    font-size: var(--logo-size); font-weight: 700; line-height: 1; margin: 0; padding: 0;
    font-family: 'Orbitron', Arial, sans-serif;
  }
  .logo { color: #fff; }
  .highlight-dot {
    display: inline-block; width: var(--dot-size); height: var(--dot-size);
    background: var(--accent); vertical-align: middle; margin: 0 2px;
  }
  .back-button {
    color: var(--accent); background: none; border: none; cursor: pointer;
    text-decoration: none; transition: color .3s;
  }
  .back-button:hover { color: var(--accent-hover); }

  .layout {
    display: grid;
    grid-template-columns: minmax(240px, calc(var(--grid-size) * 4)) 1fr;
    gap: var(--grid-size);
    padding: var(--grid-size) var(--header-pad) var(--grid-size);
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; gap: calc(var(--grid-size) / 2);
              padding: calc(var(--grid-size) / 2) var(--header-pad); }
  }

  /* ---- index list: same dot language as the home page ---- */
  .index-title, .panel-title {
    font-size: var(--detail-size); letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 16px;
  }
  .entry {
    display: block; width: 100%; text-align: left; position: relative;
    background: none; border: 0; cursor: pointer;
    padding: 10px 0 12px 26px; color: #fff;
    font-family: inherit; font-size: var(--title-size); line-height: 1.2;
    border-top: 1px solid var(--line); transition: color .25s;
  }
  .entry:last-of-type { border-bottom: 1px solid var(--line); }
  .entry::before {
    content: ""; position: absolute; left: 0; top: 14px;
    width: var(--dot-size); height: var(--dot-size);
    background: var(--line); transition: background .25s;
  }
  .entry:hover { color: var(--accent); }
  .entry:hover::before, .entry[aria-current="true"]::before { background: var(--accent); }
  .entry[aria-current="true"] { color: var(--accent); }
  .entry .meta {
    display: block; margin-top: 4px; font-size: var(--detail-size);
    color: rgba(255,255,255,.55); line-height: 1.3;
  }
  .entry:focus-visible, .back-button:focus-visible, .toggle button:focus-visible {
    outline: 2px solid var(--accent-hover); outline-offset: 3px;
  }

  /* ---- viewer ---- */
  .stage { position: relative; }
  .canvas-wrap {
    position: relative; width: 100%;
    height: calc(var(--grid-size) * 6);
    min-height: 340px;
    overflow: hidden; touch-action: none;
  }
  @media (min-width: 1200px) { .canvas-wrap { height: calc(var(--grid-size) * 7); } }
  canvas { display: block; width: 100%; height: 100%; }

  .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: var(--detail-size); line-height: 1.6;
    color: rgba(255,255,255,.7); pointer-events: none;
  }
  .status.hidden { display: none; }
  .status b { color: var(--accent); font-weight: 400; }

  .hotspot {
    position: absolute; width: var(--dot-size); height: var(--dot-size);
    background: var(--accent); transform: translate(-50%, -50%);
    cursor: help;
  }
  .hotspot span {
    position: absolute; left: 18px; top: -4px; white-space: nowrap;
    font-size: var(--detail-size); color: #fff;
    background: rgba(0,31,63,.9); padding: 2px 6px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .hotspot:hover span, .hotspot:focus span { opacity: 1; }

  .readout {
    display: flex; flex-wrap: wrap; gap: 4px var(--grid-size);
    margin-top: 14px; font-size: var(--detail-size); color: rgba(255,255,255,.6);
  }
  .readout b { color: #fff; font-weight: 400; }

  .toggle { display: flex; gap: 0; margin-top: 14px; }
  .toggle button {
    font-family: inherit; font-size: var(--detail-size); letter-spacing: .1em;
    text-transform: uppercase; color: rgba(255,255,255,.6);
    background: none; border: 1px solid var(--line); border-right: 0;
    padding: 8px 14px; cursor: pointer; transition: color .25s, border-color .25s;
  }
  .toggle button:last-child { border-right: 1px solid var(--line); }
  .toggle button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .toggle[hidden] { display: none; }

  .caption { margin-top: 18px; max-width: 62ch; font-size: var(--detail-size); line-height: 1.6; color: rgba(255,255,255,.8); }
  .caption p { margin: 0 0 10px; }
  .note { margin-top: 22px; font-size: var(--detail-size); line-height: 1.6; color: rgba(255,255,255,.45); max-width: 62ch; }
  .note a { color: var(--accent); text-decoration: underline; }
  .note a:hover { color: var(--accent-hover); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">ZAKHARGALAN<span class="highlight-dot"></span>IN</div>
    <a class="back-button" href="index.html?sorted=true">BACK</a>
  </div>

  <main class="layout">
    <nav aria-label="Scan index">
      <h2 class="index-title">Scan Library</h2>
      <div id="index"></div>
      <p class="note">
        Each entry is a scan of an existing object, captured on site and rebuilt
        as a measured 3D model. Viewer models are reduced for the web.
        Fabrication-grade files stay in the archive —
        <a href="mailto:zakhargalanin@gmail.com">request access</a>.
      </p>
    </nav>

    <section class="stage">
      <h2 class="panel-title" id="title">—</h2>
      <div class="canvas-wrap" id="wrap">
        <div class="status" id="status">Select an element</div>
      </div>

      <div class="toggle" id="toggle" hidden>
        <button type="button" data-variant="found" aria-pressed="true">As found</button>
        <button type="button" data-variant="restored" aria-pressed="false">Restored</button>
      </div>

      <div class="readout" id="readout"></div>
      <div class="caption" id="caption"></div>
    </section>
  </main>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   CATALOG — one entry per scan. Files live in /scans/.
   found     : .stl, .obj or .glb  (required)
   smooth    : true welds the facets of an STL into a smooth surface;
               leave it off to keep the raw faceted mesh
   mtl       : only for .obj — the .mtl file sitting next to it.
               .stl carries no texture and always renders as clay
   restored  : a second model; the As found / Restored toggle then
               appears on its own
   rotation  : [x, y, z] degrees, if the scan arrives lying on its side
   gridCells : how many grid cells run across the object — default 40
   keepTexture: true keeps an .obj or .glb's own texture and lighting
               instead of wrapping the model in the site grid
   scaleHint : real height of the object in inches — switches on the
               size readout under the viewer
   hotspots  : { label, x, y, z } in model units, measured from centre
------------------------------------------------------------------ */
const CATALOG = [
  {
    id: 'bust-01',
    title: 'Portrait bust',
    meta: 'Capture test · photogrammetry',
    found: 'scans/bust-01.stl',
    smooth: true,
    rotation: [-90, 0, 0],
    gridCells: 40,
    // scaleHint: 14,
    caption: [
      'Photogrammetric capture used to prove the pipeline end to end: field photography, mesh reconstruction, cleanup, and delivery to the web.',
      'The model shown here is decimated and its texture downsampled. The full-resolution mesh stays in the archive.'
    ],
    hotspots: []
  }
];

const wrap = document.getElementById('wrap');
const statusEl = document.getElementById('status');
const indexEl = document.getElementById('index');
const titleEl = document.getElementById('title');
const captionEl = document.getElementById('caption');
const readoutEl = document.getElementById('readout');
const toggleEl = document.getElementById('toggle');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.6;
controls.maxDistance = 6;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.7;
controls.addEventListener('start', () => { controls.autoRotate = false; });

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x0a1c33, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(2, 3, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0xffa64d, 0.9);
rim.position.set(-2.5, 1, -2); scene.add(rim);

const cache = new Map();
let current = null, hotspotNodes = [], activeItem = null;

function setStatus(html) {
  statusEl.innerHTML = html;
  statusEl.classList.toggle('hidden', !html);
}

/* ---------- loading: format picked from the file extension ---------- */
function fixMaterials(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      m.side = THREE.DoubleSide;
    });
  });
}

/* the page background, wrapped around the model itself: the body is the
   exact page navy and takes no light, so the form is described purely by
   grid lines bending over its surface */
function makeGridMaterial(cell) {
  const m = new THREE.MeshBasicMaterial({ color: 0x001f3f, side: THREE.DoubleSide });
  m.onBeforeCompile = shader => {
    shader.uniforms.uCell = { value: cell };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vObjPos;
        uniform float uCell;
        float axisLine(float v) {
          float s = v / uCell;
          float d = abs(fract(s - 0.5) - 0.5) / max(fwidth(s), 1e-5);
          return 1.0 - min(d, 1.0);
        }`)
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        vec3 fn = normalize(cross(dFdx(vObjPos), dFdy(vObjPos)));
        vec3 w = abs(fn);
        w /= (w.x + w.y + w.z + 1e-5);
        float g = axisLine(vObjPos.x) * (1.0 - w.x)
                + axisLine(vObjPos.y) * (1.0 - w.y)
                + axisLine(vObjPos.z) * (1.0 - w.z);
        gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), clamp(g, 0.0, 1.0) * 0.45);`);
  };
  return m;
}

function applyGrid(root, cell) {
  const m = makeGridMaterial(cell);
  root.traverse(o => { if (o.isMesh) o.material = m; });
}

async function loadFile(url, item) {
  const ext = url.split('.').pop().toLowerCase();

  if (ext === 'glb' || ext === 'gltf') {
    const gltf = await new GLTFLoader().loadAsync(url);
    fixMaterials(gltf.scene);
    return gltf.scene;
  }

  if (ext === 'stl') {
    let geo = await new STLLoader().loadAsync(url);
    if (item.smooth) { geo = mergeVertices(geo); geo.computeVertexNormals(); }
    else if (!geo.attributes.normal) geo.computeVertexNormals();
    const root = new THREE.Group();
    root.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial()));
    return root;
  }

  const mtlUrl = item.mtl;
  const objLoader = new OBJLoader();
  if (mtlUrl) {
    const mtlLoader = new MTLLoader();
    mtlLoader.setResourcePath(mtlUrl.slice(0, mtlUrl.lastIndexOf('/') + 1));
    const materials = await mtlLoader.loadAsync(mtlUrl);
    materials.preload();
    objLoader.setMaterials(materials);
  }
  const obj = await objLoader.loadAsync(url);
  fixMaterials(obj);
  return obj;
}

function clearModel() {
  if (!current) return;
  scene.remove(current);
  current = null;
}

function frame(model, item) {
  const rotation = item.rotation;
  if (rotation) {
    const d = Math.PI / 180;
    model.rotation.set(rotation[0] * d, rotation[1] * d, rotation[2] * d);
    model.updateMatrixWorld(true);
  }
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) || 1;

  if (!item.keepTexture) applyGrid(model, span / (item.gridCells || 40));

  const holder = new THREE.Group();
  model.position.sub(center);
  holder.add(model);
  holder.scale.setScalar(1 / span);

  controls.target.set(0, 0, 0);
  camera.position.set(0.9, 0.5, 1.5);
  controls.update();
  return { holder, size };
}

function showDimensions(size, heightInches) {
  if (!heightInches) { readoutEl.innerHTML = ''; return; }
  const k = heightInches / size.y;
  const f = v => (v * k).toFixed(1);
  readoutEl.innerHTML =
    `<span>Height <b>${f(size.y)}"</b></span>` +
    `<span>Width <b>${f(size.x)}"</b></span>` +
    `<span>Depth <b>${f(size.z)}"</b></span>`;
}

function buildHotspots(list) {
  hotspotNodes.forEach(h => h.el.remove());
  hotspotNodes = (list || []).map(h => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.tabIndex = 0;
    el.innerHTML = `<span>${h.label}</span>`;
    wrap.appendChild(el);
    return { el, v: new THREE.Vector3(h.x, h.y, h.z) };
  });
}

async function load(item, variant = 'found') {
  const url = item[variant];
  if (!url) return;
  activeItem = item;

  titleEl.textContent = item.title;
  captionEl.innerHTML = (item.caption || []).map(p => `<p>${p}</p>`).join('');
  toggleEl.hidden = !item.restored;
  toggleEl.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.variant === variant)));

  [...indexEl.querySelectorAll('.entry')].forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.id === item.id)));

  clearModel();
  buildHotspots(null);
  readoutEl.innerHTML = '';
  setStatus('Loading…');

  try {
    let source = cache.get(url);
    if (!source) { source = await loadFile(url, item); cache.set(url, source); }
    const { holder, size } = frame(source.clone(true), item);
    scene.add(holder);
    current = holder;
    showDimensions(size, item.scaleHint);
    buildHotspots(item.hotspots);
    controls.autoRotate = !reduceMotion;
    setStatus('');
  } catch (err) {
    setStatus(`Model not available. Expected file: <b>${url}</b>`);
  }
}

/* index list */
CATALOG.forEach(item => {
  const b = document.createElement('button');
  b.className = 'entry';
  b.type = 'button';
  b.dataset.id = item.id;
  b.innerHTML = `${item.title}<span class="meta">${item.meta}</span>`;
  b.addEventListener('click', () => load(item));
  indexEl.appendChild(b);
});

toggleEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && activeItem) load(activeItem, b.dataset.variant);
});

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const proj = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (hotspotNodes.length && current) {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    hotspotNodes.forEach(({ el, v }) => {
      proj.copy(v).applyMatrix4(current.matrixWorld).project(camera);
      el.style.display = proj.z < 1 ? 'block' : 'none';
      el.style.left = ((proj.x * 0.5 + 0.5) * w) + 'px';
      el.style.top = ((-proj.y * 0.5 + 0.5) * h) + 'px';
    });
  }
});

if (CATALOG.length) load(CATALOG[0]);
</script>
</body>
</html>
