<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakhar's Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---- all tunable values in one place ---- */
  :root {
    --bg: #001f3f;
    --accent: #ff851b;
    --accent-hover: #ffa64d;
    --line: rgba(255,255,255,0.2);
    --grid-size: 80px;
    --header-height: 80px;
    --header-pad: 80px;
    --logo-size: 60px;
    --title-size: 14px;
    --detail-size: 12px;
    --dot-size: 12px;
  }
  @media (max-width: 800px) {
    :root {
      --grid-size: 60px; --header-height: 60px; --header-pad: 40px;
      --logo-size: 30px; --title-size: 18px; --detail-size: 15px; --dot-size: 12px;
    }
  }
  @media (max-width: 600px) {
    :root {
      --grid-size: 60px; --header-height: 40px; --header-pad: 20px;
      --logo-size: 24px; --title-size: 16px; --detail-size: 14px; --dot-size: 8px;
    }
  }

  * { box-sizing: border-box; }

  /* html keeps the solid colour so the body background does NOT propagate
     to the canvas — that lets us cut the grid on a full cell */
  html { background: var(--bg); }

  body {
    margin: 0; padding: 0;
    overflow-x: hidden;
    font-family: 'Orbitron', Arial, sans-serif;
    position: relative;
    background-color: transparent;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
    background-attachment: local;
    /* closing lines on the right and bottom edge of the grid */
    box-shadow: inset -1px -1px 0 0 var(--line);
  }

  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 var(--header-pad);
    height: var(--header-height);
    position: relative; z-index: 3;
  }
  .logo, .sort-button {
    font-size: var(--logo-size);
    font-weight: 700; line-height: 1; margin: 0; padding: 0;
    font-family: 'Orbitron', Arial, sans-serif;
  }
  .logo { color: #fff; }
  .highlight-dot {
    display: inline-block;
    width: var(--dot-size); height: var(--dot-size);
    background: var(--accent);
    vertical-align: middle;
    margin: 0 2px;
  }
  .sort-button {
    color: var(--accent); background: none; border: none; cursor: pointer;
    transition: color .3s;
  }
  .sort-button:hover { color: var(--accent-hover); }
  .sort-button.sorted { color: #fff; }

  .container {
    position: relative; width: 100%; z-index: 1;
    min-height: calc(100vh - var(--header-height));
  }

  .item-link { position: absolute; z-index: 2; }
  .square {
    width: var(--dot-size); height: var(--dot-size);
    background: var(--accent);
    position: relative;
  }

  .item-text {
    color: #fff; font-size: var(--title-size); line-height: 1.15;
    position: absolute; left: 20px; top: -2px;
    white-space: nowrap; text-align: left;
    background: rgba(0,31,63,.85);
    padding: 2px 6px; border-radius: 2px;
  }
  .item-text.sorted { background: transparent; padding: 0; }

  .item-details {
    color: #fff; font-size: var(--detail-size); line-height: 1.25;
    position: absolute; left: 20px; top: 20px;
    display: none; white-space: normal; text-align: left;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .show-details { display: block; }

  a { color: #fff; text-decoration: none; }
  a:hover { color: var(--accent); }
  .certificate-link, .contact-link, a.contact-link {
    color: var(--accent) !important;
    text-decoration: underline !important;
    cursor: pointer; transition: color .3s;
  }
  .certificate-link:hover, .contact-link:hover, a.contact-link:hover { color: var(--accent-hover) !important; }

  /* Modal */
  .modal {
    display: none; position: fixed; z-index: 100; inset: 0;
    overflow: auto; background: rgba(0,0,0,.8);
  }
  .modal-content {
    margin: 5% auto; padding: 20px; position: relative;
    width: 80%; max-width: 800px; background: var(--bg);
  }
  .certificate-image { width: 100%; max-height: 80vh; }
  .close {
    position: absolute; top: 10px; right: 20px;
    color: var(--accent); font-size: 28px; font-weight: 700;
    cursor: pointer; transition: color .3s;
  }
  .close:hover { color: #fff; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">ZAKHARGALAN<span class="highlight-dot"></span>IN</div>
    <button class="sort-button">SORT</button>
  </div>
  <div class="container"></div>

  <div id="certificateModal" class="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="certificateImage" src="" alt="Certificate" class="certificate-image">
    </div>
  </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(function () {
  const $body = $('body'), container = $('.container'), modal = $('#certificateModal');

  const S = { sorted: false, run: 0 };                 // run = token to kill stale timers
  const groups = { project: [], myproject: [], skill: [], contact: [] };
  const occupied = new Set();

  /* ---------- data ---------- */
  const projects = [
    { name: 'K&G Gekon', year: '2025 - Present', details: 'Senior Estimator: GC projects up to $55M. Workflow optimization — automated manual processes: material takeoffs, manufacturer pricing requests and crew time tracking.' },
    { name: 'Freelance Estimator', year: '2019 - 2025', details: 'Estimator. Reviewed drawings/specifications and provided cost estimates for projects up to $2M across all design stages, preparing detailed material submittal packages.' },
    { name: 'Stroy Standard', year: '2019', details: 'Oversaw final finishing work for developer-delivered apartments; managed materials, documentation, and client coordination; prepared proposals and visualizations.' },
    { name: 'RestStroyGroup', year: '2019', details: 'Engineer for monastic complex restoration; produced monthly execution docs, inspected subcontractor documentation, maintained journals/reports and oversaw on-site logistics.' },
    { name: 'Ivalon', year: '2019', details: 'Site Supervisor for reconstruction of a monastic complex, managing demolition, structural work, finishes, timekeeping, reporting and materials for a 50-person team.' },
    { name: 'Earlier experience', year: '2014 - 2018', details: 'Concept-life, StroyMontazhKomplekt, Comfort Zone, TransAutomatics, Legion, ArtStroyProject, BaltHydroProject, Izhevsk Dept. of Architecture — engineer, site manager, estimator and architect-designer roles.' }
  ];

  const myProjects = [
    { label: 'CAD-to-BIM Services', details: 'CAD-to-BIM, Scan-to-BIM, existing conditions modeling, and BIM support for renovation, coordination, and preconstruction.', detailsHtml: '<a href="services.html" class="contact-link" target="_blank">CAD-to-BIM, Scan-to-BIM</a>, existing conditions modeling, and BIM support for renovation, coordination, and preconstruction.' },
    { label: 'Scan Library', details: 'Field scans of existing architectural ornament — cornices, brackets, newel posts and finials — captured on site and rebuilt as measured 3D models for restoration and replication.', detailsHtml: '<a href="scans.html" class="contact-link" target="_blank">Field scans of existing architectural ornament</a> — cornices, brackets, newel posts and finials — captured on site and rebuilt as measured 3D models for restoration and replication.' },
    { label: 'SKÅDIS Generator', details: 'Interactive 3D tool for designing custom IKEA SKÅDIS pegboard accessories. Built with Three.js — containers, hooks and hangers with real-time preview and STL export for 3D printing.', detailsHtml: '<a href="skadisgenerator.html" class="contact-link" target="_blank">Interactive 3D tool</a> for designing custom IKEA SKÅDIS pegboard accessories. Built with Three.js — containers, hooks and hangers with real-time preview and STL export for 3D printing.' },
    { label: 'GEKON Attendance', details: 'React Native mobile app for construction crew time tracking. GPS geofencing, OSHA card verification, photo documentation on clock-out, bilingual (EN/ES), Google Sheets backend via Apps Script.', detailsHtml: 'React Native mobile app for construction crew time tracking. GPS geofencing, OSHA card verification, photo documentation on clock-out, bilingual (EN/ES), Google Sheets backend via Apps Script. <a href="privacy-gekon-attendance.html" class="contact-link" target="_blank">Privacy Policy</a>' }
  ];

  const skills = [
    { label: 'Education', details: 'BSc, Peter the Great St. Petersburg Polytechnic University — Construction of Unique Buildings and Structures. Evaluated in the US as Civil Engineering.' },
    { label: 'CAD', details: 'AutoCAD, SketchUp' },
    { label: 'BIM', details: 'Revit, Tekla, Sapphire' },
    { label: 'Structural Analysis', details: 'ETABS, SCAD, Lira, Robot', detailsHtml: '<span class="certificate-link" data-img="Structuristik1.jpg">ETABS</span>, SCAD, Lira, Robot' },
    { label: 'PM and Takeoff', details: 'Navisworks, On-screen Takeoff, MS Project', detailsHtml: '<span class="certificate-link" data-img="NAVISWORKS.jpg">Navisworks</span>, On-screen Takeoff, MS Project' },
    { label: 'Programming', details: 'C#, Python, Dynamo, VBA', detailsHtml: '<span class="certificate-link" data-img="ITMO.jpg">C#</span>, Python, Dynamo, VBA' },
    { label: 'Other', details: 'Wolfram Mathematica' },
    { label: 'Language', details: 'Russian, English' }
  ];

  const contacts = [
    { label: 'Phone', details: '+1 929 784-9752', detailsHtml: '<a href="tel:+19297849752" class="contact-link">+1 929 784-9752</a>' },
    { label: 'Email', details: 'zakhargalanin@gmail.com', detailsHtml: '<a href="mailto:zakhargalanin@gmail.com" class="contact-link">zakhargalanin@gmail.com</a>' },
    { label: 'Location', details: 'New York' },
    { label: 'GitHub', details: 'www.github.com/galaninz', detailsHtml: '<a href="https://www.github.com/galaninz" class="contact-link" target="_blank">www.github.com/galaninz</a>' }
  ];

  /* ---------- helpers: CSS is the single source of truth ---------- */
  const cssNum = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
  const G   = () => cssNum('--grid-size') || 80;
  const DOT = () => cssNum('--dot-size') || 12;
  const all = () => [...groups.project, ...groups.myproject, ...groups.skill, ...groups.contact];

  // container starts under the header — this offset puts dots exactly on grid lines
  const offsetY = () => { const g = G(); return (g - (Math.round(container.offset().top) % g)) % g; };
  const firstY  = () => offsetY() + G();
  const headerH = () => Math.round(container.offset().top);

  function place(sq, x, y) {
    const d = DOT() / 2;
    sq.css('transform', `translate(${x - d + .5}px, ${y - d + .5}px)`).data({ x, y });
  }

  function bounds() {
    const g = G(), top = firstY();
    const cols = Math.max(Math.floor($(window).width() / g), 2);
    const rows = Math.max(Math.floor(($(window).height() - headerH() - top) / g), 1);
    return { g, top, cols, rows, maxX: (cols - 1) * g, maxY: top + (rows - 1) * g };
  }

  function randomCell() {
    const b = bounds();
    let x, y, n = 0;
    do {
      x = Math.floor(Math.random() * b.cols) * b.g;
      y = b.top + Math.floor(Math.random() * b.rows) * b.g;
      n++;
    } while (occupied.has(x + '_' + y) && n < b.cols * b.rows);
    occupied.add(x + '_' + y);
    return { x, y };
  }

  /* ---------- floating movement ---------- */
  function wander(sq, run) {
    if (S.sorted || run !== S.run) return;
    const b = bounds();
    const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
    let [dx, dy] = dirs[Math.floor(Math.random() * 4)];
    const dist = (2 + Math.floor(Math.random() * 3)) * b.g;

    let x = sq.data('x') + dx * dist, y = sq.data('y') + dy * dist;
    // bounce off the wall instead of getting stuck on it (keeps full step size)
    if (x < 0 || x > b.maxX || y < b.top || y > b.maxY) {
      x = sq.data('x') - dx * dist;
      y = sq.data('y') - dy * dist;
    }
    x = Math.min(Math.max(x, 0), b.maxX);
    y = Math.min(Math.max(y, b.top), b.maxY);

    const dur = dist * 2.5;
    sq.css('transition', `transform ${dur}ms linear`);
    place(sq, x, y);
    sq.data('timer', setTimeout(() => wander(sq, run), dur + 800));
  }

  /* ---------- grid-only movement to a sorted position ---------- */
  function step(sq, tx, ty, run, done) {
    if (run !== S.run) return;
    const g = G();
    let x = sq.data('x'), y = sq.data('y');
    if (x === tx && y === ty) { if (done) done(); return; }
    if (x !== tx) x += Math.sign(tx - x) * Math.min(g, Math.abs(tx - x));
    else          y += Math.sign(ty - y) * Math.min(g, Math.abs(ty - y));
    const dur = g * 2.5;
    sq.css('transition', `transform ${dur}ms linear`);
    place(sq, x, y);
    sq.data('timer', setTimeout(() => step(sq, tx, ty, run, done), dur));
  }

  /* ---------- typing ---------- */
  function type(el, plain, html, run) {
    let i = 0;
    el.text('');
    (function tick() {
      if (run !== S.run) return;
      if (i < plain.length) { el.append(plain.charAt(i++)); setTimeout(tick, 12); }
      else el.html(html);
    })();
  }

  // real rendered height of one entry, so rows never overlap
  function measure(sq) {
    const det = sq.find('.item-details');
    det.html(det.data('html')).css({ display: 'block', visibility: 'hidden' });
    const h = det.position().top + det.outerHeight();
    det.css({ display: '', visibility: '' }).text(det.data('plain'));
    return h;
  }

  // one shared description size, as large as possible, so every entry fits ONE grid cell
  function shrinkToOneCell(lists, g) {
    const base = cssNum('--detail-size') || 12, min = 8;
    const items = lists.flat();
    for (let size = base; size >= min; size--) {
      $('.item-details').css('font-size', size + 'px');
      if (items.every(sq => measure(sq) <= g - 6)) return size;
    }
    return min;
  }

  /* ---------- build ---------- */
  function createItem(item, type) {
    const label = item.name ? `${item.name} (${item.year})` : item.label;
    const sq = $('<div class="item-link"></div>');
    $('<div class="square"></div>').appendTo(sq);
    $('<div class="item-text"></div>').text(label).appendTo(sq);
    $('<div class="item-details"></div>')
      .data({ plain: item.details, html: item.detailsHtml || item.details })
      .text(item.details).appendTo(sq);

    const c = randomCell();
    place(sq, c.x, c.y);
    sq.appendTo(container);
    groups[type].push(sq);
    wander(sq, S.run);
  }

  function build() {
    occupied.clear();
    Object.keys(groups).forEach(k => { groups[k].forEach(s => s.remove()); groups[k].length = 0; });
    projects.forEach(i => createItem(i, 'project'));
    myProjects.forEach(i => createItem(i, 'myproject'));
    skills.forEach(i => createItem(i, 'skill'));
    contacts.forEach(i => createItem(i, 'contact'));
  }

  function fitBody() {
    const g = G();
    const h = Math.floor($(window).height() / g) * g;   // only complete cells
    $body.css({ minHeight: h + 'px', height: S.sorted ? 'auto' : h + 'px' });
  }

  function stopAll() { all().forEach(sq => { clearTimeout(sq.data('timer')); sq.stop(true, false); }); }

  /* ---------- SORT ---------- */
  function sort() {
    S.sorted = true; S.run++;
    const run = S.run;
    stopAll();

    const g = G(), w = $(window).width();
    const units = Math.max(Math.floor(w / g), 3);
    const cols  = w >= 1200 ? 4 : w >= 800 ? 2 : 1;
    const avail = Math.max(units - 2, 2);

    let u;
    if (cols === 4) {
      const a = Math.max(Math.round(avail * .34), 2);
      const b = Math.max(Math.round(avail * .30), 2);
      const c = Math.max(Math.round(avail * .18), 2);
      u = [a, b, c, Math.max(avail - a - b - c, 2)];
    } else if (cols === 2) {
      const second = Math.min(6, Math.max(Math.round(avail * .38), 3));
      u = [Math.max(avail - second, 3), second];
    } else {
      u = [avail];
    }

    const xs = []; let acc = g;
    u.forEach(n => { xs.push(acc); acc += n * g; });
    const colW = u.map(n => n * g - g / 2);

    const lists = cols === 4
      ? [groups.project, groups.myproject, groups.skill, groups.contact]
      : cols === 2
        ? [[...groups.project, ...groups.myproject], [...groups.contact, ...groups.skill]]
        : [[...groups.project, ...groups.myproject, ...groups.contact, ...groups.skill]];

    const top = firstY();
    let bottom = top;

    // pass 1 — column widths, details go right under the title
    lists.forEach((list, ci) => list.forEach(sq => {
      const txt = sq.find('.item-text').addClass('sorted')
        .css({ width: colW[ci] + 'px', maxWidth: colW[ci] + 'px', whiteSpace: 'normal' });
      sq.find('.item-details').css({
        width: colW[ci] + 'px', maxWidth: colW[ci] + 'px',
        fontSize: '', top: (txt.outerHeight() + 3) + 'px'
      });
    }));

    // pass 2 — fit the descriptions into a single cell
    shrinkToOneCell(lists, g);

    // pass 3 — place
    lists.forEach((list, ci) => {
      let y = top;
      list.forEach(sq => {
        const cell = Math.max(Math.ceil(measure(sq) / g) * g, g);
        step(sq, xs[ci], y, run, () => {
          const d = sq.find('.item-details');
          if (!d.hasClass('show-details')) { d.addClass('show-details'); type(d, d.data('plain'), d.data('html'), run); }
        });
        y += cell;
      });
      bottom = Math.max(bottom, y);
    });

    const total = bottom + g;
    container.css('height', total + 'px');
    $body.css({ height: 'auto', minHeight: Math.ceil((total + headerH()) / g) * g + 'px' });
  }

  /* ---------- UNSORT ---------- */
  function unsort() {
    S.sorted = false; S.run++;
    const run = S.run;
    stopAll();
    occupied.clear();
    container.css('height', '');
    fitBody();

    all().forEach(sq => {
      const det = sq.find('.item-details');
      det.removeClass('show-details').removeAttr('style').text(det.data('plain'));
      sq.find('.item-text').removeClass('sorted').removeAttr('style');

      const c = randomCell();
      sq.fadeOut(400, function () {
        sq.css('transition', 'none');
        place(sq, c.x, c.y);
        sq.fadeIn(400, function () {
          sq.css('transition', '');
          wander(sq, run);
        });
      });
    });
  }

  /* ---------- init ---------- */
  fitBody();
  build();

  $('.sort-button').on('click', function () {
    if (S.sorted) { unsort(); $(this).removeClass('sorted').text('SORT'); }
    else          { sort();   $(this).addClass('sorted').text('UNSORT'); }
  });

  if (new URLSearchParams(location.search).get('sorted') === 'true') {
    setTimeout(() => { sort(); $('.sort-button').addClass('sorted').text('UNSORT'); }, 300);
  }

  $(document).on('click', '.certificate-link', function () {
    $('#certificateImage').attr('src', $(this).data('img'));
    modal.show();
  });
  modal.on('click', e => { if (e.target === modal[0] || $(e.target).is('.close')) modal.hide(); });
  $(document).on('keyup', e => { if (e.key === 'Escape') modal.hide(); });

  // debounced resize, keeps the current mode
  let lastW = $(window).width(), rt;
  $(window).on('resize', function () {
    const w = $(window).width();
    if (w === lastW) return;
    lastW = w;
    clearTimeout(rt);
    rt = setTimeout(function () {
      const wasSorted = S.sorted;
      S.sorted = false; S.run++;
      fitBody();
      build();
      if (wasSorted) sort();
    }, 150);
  });
});
</script>
</body>
</html>
